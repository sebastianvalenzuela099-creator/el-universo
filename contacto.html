<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Espacial</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <header>
        <h1>CONTACTO</h1>
    </header>

    <nav>
        <a href="index.html">( INICIO )</a>
        <a href="satelites.html">( SATELITES )</a>
        <a href="chatarra.html">( CHATARRA )</a>
        <a href="riesgos.html">( RIESGOS )</a>
        <a href="contacto.html" class="active">( CONTACTO )</a>
    </nav>

    <div class="card-section">
        <span class="contacto-email">@ESPACIALTXTGMAIL.COM</span>
        
        <form action="#" method="post">
            <div class="form-row">
                <div class="form-label">NOMBRE</div>
                <input type="text" class="form-input" placeholder="Tu nombre" required>
            </div>
            <div class="form-row">
                <div class="form-label">CORREO ELECTRONICO</div>
                <input type="email" class="form-input" placeholder="tu@email.com" required>
            </div>
            <div class="form-row">
                <div class="form-label">MENSAJE</div>
                <textarea class="form-input" rows="4" placeholder="Escribe tu mensaje..." required></textarea>
            </div>
            <button type="submit" class="btn-submit">ENVIAR</button>
        </form>
    </div>
</body>
</html>
